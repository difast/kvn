<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый пароль — KVN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%233b82f6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top"><a class="logo" href="/">K<b>VN</b></a></header>
  <div class="card narrow">
    <form id="form" novalidate>
      <label>Новый пароль<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <div class="msg" id="msg" role="alert"></div>
      <button class="btn" type="submit">Сохранить пароль</button>
    </form>
  </div>
</div>
<script type="module">
import { api, $, flash } from '/js/api.js';
const token = new URLSearchParams(location.hash.slice(1)).get('token');
$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = $('#password').value;
  if (!token) return flash($('#msg'), 'Ссылка недействительна');
  if (password.length < 8) return flash($('#msg'), 'Пароль — минимум 8 символов');
  try { await api.reset(token, password); flash($('#msg'), 'Пароль обновлён. Перенаправляем…', 'ok'); setTimeout(() => location.href = '/auth.html', 1200); }
  catch (err) { flash($('#msg'), err.message); }
});
</script>
</body>
</html>
