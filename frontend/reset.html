<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый пароль — KVN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%233b82f6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="/">K<b>VN</b></a></div></header>
<div class="wrap" style="padding:32px 0">
  <div class="card auth-card">
    <h2 style="font-size:22px;margin-bottom:16px">Новый пароль</h2>
    <form id="form" novalidate>
      <div class="field">
        <label for="password">Новый пароль</label>
        <div class="input-wrap">
          <input id="password" type="password" autocomplete="new-password" maxlength="128" placeholder="Минимум 8 символов" required>
          <button class="toggle" id="toggle" type="button" aria-label="Показать пароль">Показать</button>
        </div>
      </div>
      <div class="msg" id="msg" role="alert"></div>
      <button class="btn block" type="submit">Сохранить пароль</button>
    </form>
  </div>
</div>
<script type="module" src="/js/reset.js"></script>
</body>
</html>
