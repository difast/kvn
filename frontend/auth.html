<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — KVN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%233b82f6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top"><a class="logo" href="/">K<b>VN</b></a></header>
  <div class="card narrow">
    <div class="tabs"><button id="t-register" type="button">Регистрация</button><button id="t-login" type="button">Вход</button></div>
    <form id="form" novalidate>
      <label>Email<input id="email" type="email" autocomplete="email" inputmode="email" required></label>
      <label>Пароль<input id="password" type="password" minlength="8" maxlength="128" required></label>
      <div class="msg" id="msg" role="alert"></div>
      <button class="btn" id="submit" type="submit"></button>
      <a id="forgot" href="#" style="text-align:center;font-size:14px">Забыли пароль?</a>
    </form>
  </div>
</div>
<script type="module">
import { api, $, flash } from '/js/api.js';
if (api.isLoggedIn()) location.replace('/dashboard.html');

let mode = location.hash === '#register' ? 'register' : 'login';
function render() {
  $('#t-register').classList.toggle('on', mode === 'register');
  $('#t-login').classList.toggle('on', mode === 'login');
  $('#submit').textContent = mode === 'register' ? 'Создать аккаунт' : 'Войти';
  $('#password').autocomplete = mode === 'register' ? 'new-password' : 'current-password';
  $('#forgot').style.display = mode === 'login' ? '' : 'none';
  $('#msg').className = 'msg';
}
$('#t-register').onclick = () => { mode = 'register'; render(); };
$('#t-login').onclick = () => { mode = 'login'; render(); };
render();

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#email').value.trim(), password = $('#password').value;
  if (!email || !email.includes('@')) return flash($('#msg'), 'Введите корректный email');
  if (mode === 'register' && password.length < 8) return flash($('#msg'), 'Пароль — минимум 8 символов');
  $('#submit').disabled = true;
  try {
    await (mode === 'register' ? api.register(email, password) : api.login(email, password));
    location.href = '/dashboard.html';
  } catch (err) { flash($('#msg'), err.message); }
  finally { $('#submit').disabled = false; }
});

$('#forgot').onclick = async (e) => {
  e.preventDefault();
  const email = $('#email').value.trim();
  if (!email) return flash($('#msg'), 'Введите email выше');
  try { await api.forgot(email); flash($('#msg'), 'Если такой аккаунт есть, мы отправили письмо со ссылкой', 'ok'); }
  catch (err) { flash($('#msg'), err.message); }
};
</script>
</body>
</html>
